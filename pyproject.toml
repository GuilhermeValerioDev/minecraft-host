[project]
name = "mchost"
version = "0.1.0"
description = "A terminal app for hosting and managing containerized Minecraft servers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "textual>=1.0",
    "rich>=13.7",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "tomli-w>=1.0",
]

[project.scripts]
mchost = "mchost.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mchost"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
